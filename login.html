<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIDA CMS - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=DM+Mono&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 85% 10%, #daf8fb 0, transparent 23%), var(--pale);
      overflow: hidden;
    }
    .login-panel {
      width: 100%;
      max-width: 420px;
      padding: clamp(30px, 5vw, 50px);
      border-radius: var(--r);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      animation: slideUpFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-brand a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bevan', 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      letter-spacing: -.02em;
      color: var(--ink);
      text-transform: uppercase;
      justify-content: center;
    }
    .login-brand .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: cover;
      box-shadow: 0 8px 20px #007f8745;
    }
    .login-brand .brand-mark {
      font-family: 'Bevan', 'Playfair Display', serif;
      font-size: .6em;
      letter-spacing: -.01em;
      color: var(--teal);
      opacity: .95;
    }
    .login-form .field {
      margin-bottom: 20px;
    }
    .login-form button {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px #3d8a9333;
    }
    .error-msg {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .error-msg.visible {
      opacity: 1;
    }
    /* Animated background elements */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 10s infinite alternate ease-in-out;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: #b8ebf188;
      top: -100px;
      left: -100px;
    }
    .shape-2 {
      width: 300px;
      height: 300px;
      background: #007f8744;
      bottom: -50px;
      right: -50px;
      animation-delay: -5s;
    }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="login-panel">
    <div class="login-brand">
      <a href="index.html"><img class="brand-logo" src="asserts/fida-logo.png" alt="FIDA Filaments logo">FIDA <span class="brand-mark">FILAMENTS</span></a>
      <p class="eyebrow" style="margin-top: 10px;">CMS LOGIN</p>
    </div>

    <form class="login-form" id="login-form">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="name@company.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="button" type="submit">Log into Dashboard</button>
      <div class="error-msg" id="error-msg">Invalid email or password.</div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      if (email === 'admin@gmail.com' && password === 'password') {
        sessionStorage.setItem('fida_admin_auth', 'true');
        document.querySelector('.login-panel').style.animation = 'fadeOut 0.4s forwards';
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 400);
      } else {
        errorMsg.classList.add('visible');
        document.querySelector('.login-panel').animate([
          { transform: 'translateX(0px)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(0px)' }
        ], { duration: 400, easing: 'ease-in-out' });
      }
    });

    // If already logged in, redirect to admin
    if (sessionStorage.getItem('fida_admin_auth') === 'true') {
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
